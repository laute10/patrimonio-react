<title id="titulo">Árbol de componentes de Patrimonio</title>
<desc id="descripcion">App guarda el estado tema. AppInterna guarda el estado usuario, pantallaAcceso, paginaActual, parametros y ayudaAbierta y usa el hook usePatrimonio. Estructura común: Header, Footer, EstadoCarga y PanelAyuda. PanelAyuda: PanelLateral. Pantallas de acceso (Login, CrearCuenta y Recuperar): AuthLayout, CampoFormulario y EnlaceTexto. AuthLayout: Footer. Inicio: PanelLateral, TarjetaMini, MovimientoItem y FormularioMovimiento. FormularioMovimiento: CampoFormulario y SelectorCategoria. Movimientos: PanelMovimiento. PanelMovimiento: PanelLateral, Modal y FormularioMovimiento. Ahorros: PanelLateral, CampoFormulario, Modal, SelectorIcono, TarjetaObjetivo y PanelObjetivo. PanelObjetivo: PanelLateral, Modal, CampoFormulario y SelectorIcono. Tarjetas: PanelLateral, SelectorCategoria y CampoFormulario. Estadísticas: PanelGrafico. Configuración: CampoFormulario y PanelLateral. Overlay y Iconos se usan en casi todas las pantallas.</desc>
